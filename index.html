<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七夕抽奖报名</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #ffe6ef;
            padding: 30px 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 4px 16px #f8b8cc;
        }
        h1 {
            text-align: center;
            color: #d6336c;
            font-size: 24px;
            margin-bottom:12px;
        }
        .prize-block{
            background-color: #fff0f6;
            border-radius:12px;
            padding:16px;
            margin:20px 0;
        }
        .prize-block h3{
            color:#c2255c;
            margin-bottom:10px;
        }
        .prize-item{
            font-size:15px;
            line-height:1.8;
            color:#444;
        }
        .form-item{
            margin:18px 0;
        }
        label{
            display:block;
            margin-bottom:6px;
            font-weight:500;
            color:#333;
        }
        input{
            width:100%;
            padding:12px 14px;
            border:1px solid #f2b8c8;
            border-radius:10px;
            font-size:16px;
        }
        input:focus{
            outline:none;
            border-color:#d6336c;
        }
        button{
            width:100%;
            background:#d6336c;
            color:white;
            border:none;
            padding:14px;
            border-radius:10px;
            font-size:17px;
            font-weight:bold;
            margin-top:10px;
        }
        button:active{
            background:#b02456;
        }
        .tip{
            margin-top:16px;
            text-align:center;
            font-size:13px;
            color:#888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>💖七夕抽奖活动</h1>
    <div class="prize-block">
        <h3>🎁奖品列表</h3>
        <div class="prize-item">特等奖：100元（1份）</div>
        <div class="prize-item">一等奖：50元（1份）</div>
        <div class="prize-item">二等奖：25元（2份）</div>
        <div class="prize-item">三等奖：15元（3份）</div>
        <div class="prize-item">四等奖：蜜雪冰城10元礼品卡（5份）</div>
        <div class="prize-item">五等奖：3张无门槛蜜雪冰城3元代金券（10份）</div>
    </div>

    <form id="lotteryForm">
        <div class="form-item">
            <label>你的姓名（必填）</label>
            <input type="text" id="username" placeholder="请输入姓名" required>
        </div>
        <div class="form-item">
            <label>参与序号（必填）</label>
            <input type="number" id="seq" placeholder="填写你的序号" required>
        </div>
        <button type="submit">✨提交参与抽奖</button>
    </form>
    <div class="tip">提交成功后自动跳转活动页面</div>
</div>

<script>
    const form = document.getElementById('lotteryForm');
    form.addEventListener('submit',function(e){
        e.preventDefault();
        const name = document.getElementById('username').value.trim();
        const num = document.getElementById('seq').value.trim();
        if(!name || !num){
            alert("姓名和序号都必须填写！");
            return;
        }
        // 填写完成跳转目标地址
        window.location.href = "https://vdse.bdstatic.com//192d9a98d782d9c74c96f09db9378d93.mp4";
    })
</script>
</body>
</html>
